# Local Kubernetes deployments for the React and Angular portals.
# Use kubectl port-forward to open them from your browser.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: orderflow-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: customer-portal }
  template:
    metadata:
      labels: { app: customer-portal }
    spec:
      containers:
        - name: customer-portal
          image: orderflow/customer-portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: orderflow-local
spec:
  selector: { app: customer-portal }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  namespace: orderflow-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: admin-portal }
  template:
    metadata:
      labels: { app: admin-portal }
    spec:
      containers:
        - name: admin-portal
          image: orderflow/admin-portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: orderflow-local
spec:
  selector: { app: admin-portal }
  ports:
    - port: 80
      targetPort: 80
