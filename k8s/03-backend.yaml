apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: orderflow-local
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: orderflow/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: orderflow-config, key: ASPNETCORE_ENVIRONMENT } }
            - name: ASPNETCORE_URLS
              valueFrom: { configMapKeyRef: { name: orderflow-config, key: ASPNETCORE_URLS } }
            - name: ReverseProxy__Clusters__customers__Destinations__default__Address
              value: http://customer-service:8080/
            - name: ReverseProxy__Clusters__products__Destinations__default__Address
              value: http://product-service:8080/
            - name: ReverseProxy__Clusters__inventory__Destinations__default__Address
              value: http://inventory-service:8080/
            - name: ReverseProxy__Clusters__orders__Destinations__default__Address
              value: http://order-service:8080/
            - name: ReverseProxy__Clusters__payments__Destinations__default__Address
              value: http://payment-service:8080/
            - name: ReverseProxy__Clusters__notifications__Destinations__default__Address
              value: http://notification-service:8080/
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: orderflow-local
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080
