# Local Kubernetes deployments for OrderFlow .NET services and YARP Gateway.
# Images use the :local tag built on your own machine; nothing is pushed online.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: orderflow-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: orderflow/auth-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: orderflow-config, key: ASPNETCORE_ENVIRONMENT } }
            - name: ASPNETCORE_URLS
              valueFrom: { configMapKeyRef: { name: orderflow-config, key: ASPNETCORE_URLS } }
            - name: ConnectionStrings__OrderFlowDatabase
              value: "Server=sqlserver,1433;Database=OrderFlow;User Id=sa;Password=OrderFlow_Local_12345!;TrustServerCertificate=True;MultipleActiveResultSets=true"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: orderflow-local
spec:
  selector: { app: auth-api }
  ports:
    - port: 8080
      targetPort: 8080
---
